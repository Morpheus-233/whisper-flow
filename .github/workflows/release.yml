name: Build and Release Standalone Executable

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Portable Executable
        run: |
          pyinstaller --noconfirm --onedir --windowed `
            --name "WhisperFlow" `
            --add-data "ui;ui" `
            --collect-all faster_whisper `
            --collect-all ctranslate2 `
            --collect-all uiautomation `
            --collect-all sounddevice `
            app.py

      - name: Copy auxiliary scripts
        run: |
          Copy-Item WhisperFlow_Silent.vbs dist/WhisperFlow/
          Copy-Item run_app.bat dist/WhisperFlow/
          Copy-Item README.md dist/WhisperFlow/

      - name: Compress Build Artifact
        run: |
          Compress-Archive -Path dist/WhisperFlow -DestinationPath WhisperFlow-windows-x64.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: WhisperFlow-windows-x64.zip
          draft: false
          prerelease: false
          generate_release_notes: true
